name: Tests

on:
  push:
    branches: [master, production]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: savannah
          POSTGRES_USER: savannah
          POSTGRES_PASSWORD: savannah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savannah"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: savannah.test_settings
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: savannah
      DATABASE_USER: savannah
      DATABASE_PASSWORD: savannah
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.8"
      - name: Install requirements
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django system checks
        run: python manage.py check
      - name: Run tests
        run: pytest
